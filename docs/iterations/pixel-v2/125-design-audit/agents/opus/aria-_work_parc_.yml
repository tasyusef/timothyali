- main:
  - heading "parc" [level=1]
  - paragraph: I cofounded Pixel Ape Rowboat Club in 2021 and have led its branding and art direction since. In 2026, I redesigned the identity around the apes’ 5×5 grid and made a typeface for it, PARC Pixel. Then I built a new website with live stats, a gallery, merch, and a rowing game.
