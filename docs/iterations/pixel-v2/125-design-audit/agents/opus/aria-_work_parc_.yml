  - text: 07 / 11
  - heading "The website" [level=2]
  - paragraph: PARC had outgrown its Squarespace site. The club now had four collections, a token, a Twitch show, an arcade, and merch. I designed a new site to bring them together and built it with Claude Code, directing the work and reviewing every screen.
  - paragraph: I built the site around the logo’s pixel grid and the club’s island setting. The Clubhouse, Gallery, and PARCade each have their own place in that world. The home page opens with the wordmark on a notched paper card. Inner pages use a jungle canopy, drifting clouds, and a wooden sign for the title and introduction.
  - paragraph: "The notch shows up everywhere: 6px on buttons, 10px on cards, 12px on panels. Buttons sit on a darker base, lift on hover, and drop when you press them. The motion is pixel-based too. Buttons move in steps, water shifts one cell at a time, and dropdowns open line by line. With reduced motion on, the animated backgrounds hold still."
  - figure:
