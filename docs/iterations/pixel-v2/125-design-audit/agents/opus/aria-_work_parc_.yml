  - text: 11 / 11
  - heading "Merch & community" [level=2]
  - paragraph: I originally planned to link out to the merch store. Using its API meant I could put the catalog on the site and send people to the store only for checkout. Each section got a small detail of its own. After Darc has TV static, chat bubbles drift past the Discord section, and the LARC teaser has a working terminal. The 404 sign says you rowed off the map.
