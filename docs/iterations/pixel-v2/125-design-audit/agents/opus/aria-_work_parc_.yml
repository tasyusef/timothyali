  - text: 06 / 11
  - heading "Streams, merch, and social" [level=2]
  - paragraph: Outside the site, the identity shows up on Discord, X, Twitch, merch, and the arcade. After Darc, the club’s Twitch show, has its own graphics and a starting-soon animation.
