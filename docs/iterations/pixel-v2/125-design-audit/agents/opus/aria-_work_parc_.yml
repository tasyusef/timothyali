  - text: 08 / 11
  - heading "Stats first" [level=2]
  - paragraph: I put Stats first in the navigation so holders could find it fast. It has floor prices, trading volume, holders, and listings for each collection, plus $OAR token data. The numbers come from the ledger and marketplace APIs, and daily snapshots feed the charts, going back to launch.
  - figure:
    - 'img "parcxrpl.com Club Stats: the $OAR card with price, volume, market cap, holders, and two pixel bar charts"'
  - text: 09 / 11
  - heading "Gallery & Clubhouse" [level=2]
  - paragraph: In the Gallery, apes hang on clotheslines between two trees. Selecting a frame opens a plaque with the ape’s name. My first version turned wheel input into sideways scrolling. It was awkward to use, so I switched to normal vertical scrolling.
  - paragraph: The Clubhouse took three layouts to get right. It ended up with a TV playing the Twitch stream, a trophy shelf, and a corkboard for events, suspended from branches. I checked the ropes at different screen widths to keep them attached.
  - figure:
    - 'img "parcxrpl.com Gallery: the hanging sign with a button for each collection, and the generative apes on clotheslines between two trees"'
  - figure:
    - 'img "parcxrpl.com Clubhouse: the hanging sign, the TV on its branch, and the cork notice board"'
  - text: 10 / 11
  - heading "PARCade" [level=2]
  - paragraph: PARCade is an arcade cabinet with a green CRT, scanlines, a joystick, and buttons that work the menu. On the homepage, a smaller screen shows the game cover next to live high scores, with scenery built from the game’s sprites around it.
  - paragraph: I also made Rowboat Racer, where an ape rows down a five-lane river dodging logs, reefs, and ziggurats. I drew the sprites on a 3px grid. The riverbanks change between beach, jungle, rock, and village scenery on each run. The server replays a run before accepting its score on the leaderboard.
