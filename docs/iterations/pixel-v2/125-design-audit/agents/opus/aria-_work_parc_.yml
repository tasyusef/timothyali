  - heading "The reaction" [level=2]
  - list:
    - listitem: 01 “I know I like the new banner and logo” / RedHotDankMoist, Discord
    - listitem: 02 “Love it, great website update, looks amazing” / @BrandoWoodz, X
  - text: 04 / 11
  - heading "Logo, color, and spacing" [level=2]
  - paragraph: I made a wide logo, a square lockup, and an oar badge, all on the same cell grid with notched corners and two cells of clear space around them. The final artwork is merged paths, so it goes straight into print and web files.
  - paragraph: The palette has five colors. The logo uses four of them, and everything else uses one at a time. I gave hex values for web and CMYK for print, and ruled out yellow type on white because it’s hard to read.
  - paragraph: The oar works as a favicon, a badge, and a divider. I also put it on the typeface’s equals key so it’s easy to use in a line of text.
  - text: 05 / 11
  - heading "The typeface" [level=2]
  - paragraph: "I built PARC Pixel from the four letters in the logo, keeping their one-cell strokes, open counters, and stepped diagonals. Scripts generate the family from the logo’s grid: three weights and a monospaced version for scores and prices, with 56 glyphs in each. It took four days from the first glyph to the finished family."
  - paragraph: The scripts struggled with some characters, especially the number 2. I built a small editor to place pixels by hand, then used the scripts to compile the fonts. I drew 29 glyphs across the family this way, including the bold 2, the oar, and all three at-signs, and checked them in words at reading size.
