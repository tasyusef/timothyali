  - text: 01 / 11
  - heading "Where it started" [level=2]
  - paragraph: PARC started in November 2021 as a joke. People were treating pixel apes as status symbols, and we thought that was ridiculous. Bored Apes had yachts. Ours had rowboats. 10,000 pixel apes on the XRP Ledger, no clout included.
  - paragraph: People stayed anyway. By 2026, PARC had four collections, a Twitch show, an arcade, merch, and its own lore. I run it with xrpl_adam on development, sloppy on marketing, and stove drawing the apes with me. The old identity no longer matched what we were making.
  - paragraph: "The apes were drawn with the Game Boy Advance Pokémon games in mind: flat color, chunky pixels, sprites you could recognize at a glance. We built them a world of islands, rowboats, volcanoes, and wooden huts, and the rebrand had to look like it belonged there."
  - text: 02 / 11
  - heading "An earlier direction" [level=2]
  - paragraph: "Around 2024, I tried splitting the club into three branches: The Rowboat Club with an oar, The Parcade with a red joystick, and The Nightclub with a red microphone, each with a black pixel wordmark. We liked how it looked, but it felt too serious and dark for PARC, so we set it aside."
  - figure:
    - 'img "The earlier direction: three black pixel lockups on white, The Nightclub with a red microphone, The Parcade with a red joystick, and The Rowboat Club with an oar"'
  - paragraph: Set aside, around 2024
  - text: 03 / 11
  - heading "Redrawing the logo" [level=2]
  - paragraph: The old logo was a cartoon ape with thick outlines and a bubbly wordmark. It didn’t look much like the pixel art around it. I drew the new logo on the apes’ 5×5 grid and put it on a white sign with notched corners.
  - paragraph: The team was attached to the old identity and worried about how the community would react. This time I showed them the finished logo on its sign and asked them to trust me. The comments after launch were encouraging.
  - figure:
