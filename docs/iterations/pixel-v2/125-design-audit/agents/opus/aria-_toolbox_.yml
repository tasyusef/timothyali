  - region "Automate your exports.":
    - heading "Automate your exports." [level=2]
    - paragraph: Use the same tools from your terminal, or from an AI assistant over MCP. You can inspect files, preview exports, and reopen saved work without opening the app.
    - code: toolbox --mcp
    - link "CLI & MCP docs":
      - /url: /toolbox/agents/
